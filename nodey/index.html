<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Budgity</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script>
            if (window.self !== window.top) document.documentElement.classList.add('embedded');
            // Use the theme chosen on the dashboard (saved in localStorage), or follow the OS.
            (function () {
                function apply() {
                    try {
                        var t = localStorage.getItem('budgity-theme');
                        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
                        else document.documentElement.removeAttribute('data-theme');
                    } catch (e) {}
                }
                apply();
                // Fires when the dashboard (parent page) changes the setting.
                window.addEventListener('storage', function () { apply(); window.dispatchEvent(new Event('budgity-theme')); });
            })();
        </script>
        <link rel="stylesheet" href="./style.css">
        <script src="./jquery-4.0.0.min.js"></script>
        <script src="./jquery-ui.min.js"></script>
    </head>
